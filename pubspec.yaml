name: waveon
description: "A Flutter architecture.."
publish_to: 'none' 
version: 1.0.0+1
environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^17.0.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1
  permission_handler: ^12.0.1
  path: ^1.9.1
  shimmer: ^3.0.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  just_audio_background: ^0.0.1-beta.17
  cloud_firestore: ^6.1.1
  network_info_plus: ^7.0.0
  on_audio_query: ^2.9.0
  shelf: ^1.4.2
  audio_converter_native: ^1.0.4
  shared_preferences: ^2.5.5
  device_info_plus: ^12.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: adaptive_icon
  ios: true
  image_path: assets/icon_foreground.png
  adaptive_icon_background: "#001530"
  adaptive_icon_foreground: assets/icon_foreground.png